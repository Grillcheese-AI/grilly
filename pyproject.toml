[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grilly"
dynamic = ["version"]
description = "GPU-accelerated neural network operations using Vulkan compute shaders"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Cloutier", email = "ncloutier@grillcheeseai.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["vulkan", "gpu", "neural-network", "snn", "compute-shaders", "gpu-acceleration", "lora-bridge", "huggingface-bridge", "machine-learning", "torch-alternative","synapse", "neuron network", "hebbian-learning"]

dependencies = [
    "blake3>=1.0.8",
    "numba>=0.63.1",
    "numpy",
    "onnx>=1.15.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "sentence-transformers>=5.2.0",
    "spacy>=3.8.11",
    "torch>=2.10.0",
    "transformers>=4.57.6",
    "twine>=6.2.0",
    "vulkan>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
accel = [
    "numba>=0.59.0",  # JIT-compiled CPU fallbacks
]
all = [
    "grilly[dev,accel]",
]

[project.urls]
Homepage = "https://grillcheeseai.com"
Repository = "https://github.com/grillcheese-ai/grilly"
Documentation = "https://grillcheeseai.com"

# Explicit package mapping since pyproject.toml is inside the package directory
[tool.setuptools]
packages = [
    "grilly",
    "grilly.backend",
    "grilly.datasets",
    "grilly.examples",
    "grilly.experimental_datasets",
    "grilly.nn",
    "grilly.optim",
    "grilly.utils",
    "grilly.functional",
    "grilly.scripts",
    "grilly.tutorials",
    "grilly.tests",
    "grilly.experimental"
]

[tool.setuptools.package-dir]
"grilly" = "."
"grilly.backend" = "backend"
"grilly.nn" = "nn"
"grilly.optim" = "optim"
"grilly.utils" = "utils"
"grilly.functional" = "functional"
"grilly.scripts" = "scripts"
"grilly.tutorials" = "tutorials"
"grilly.tests" = "tests"
"grilly.experimental" = "experimental"
"grilly.experimental_datasets" = "experimental_datasets"
"grilly.datasets" = "datasets"
"grilly.examples" = "examples"

[tool.setuptools.package-data]
grilly = [
    "shaders/**/*.glsl",
    "shaders/**/*.comp",
    "shaders/**/*.spv",
]

[tool.setuptools_scm]
write_to = "_version.py"

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
    | __pycache__
    | \.venv
    | build
    | dist
    | shaders/spv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["grilly/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "grilly",
]
