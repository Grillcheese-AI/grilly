[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

# C++ extension is NOT built by pip install. It's pre-built and distributed
# via GitHub releases. To build from source, use:
#   pip install scikit-build-core pybind11
#   python -m scikit_build_core.build --wheel
#
# Or just download grilly_core.cpXYZ-win_amd64.pyd from:
#   https://github.com/Grillcheese-AI/grilly/releases

[project]
name = "grilly"
version = "0.5.6"
description = "GPU-accelerated neural network operations using Vulkan compute shaders"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Cloutier", email = "ncloutier@grillcheeseai.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["vulkan", "gpu", "neural-network", "snn", "compute-shaders", "gpu-acceleration", "lora-bridge", "huggingface-bridge", "machine-learning", "torch-alternative","synapse", "neuron network", "hebbian-learning"]

dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Core GPU ops only need numpy. Everything else is optional.
full = [
    "blake3>=1.0.8",
    "numba>=0.63.1",
    "torch>=2.10.0",
    "transformers>=4.57.6",
    "sentence-transformers>=5.2.0",
    "spacy>=3.8.11",
    "onnx>=1.15.0",
    "vulkan>=1.3.0",
]
torch = ["torch>=2.10.0"]
huggingface = ["transformers>=4.57.6", "sentence-transformers>=5.2.0"]
onnx = ["onnx>=1.15.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "mkdocs-material>=9.0",
]
accel = [
    "numba>=0.59.0",  # JIT-compiled CPU fallbacks
]
all = [
    "grilly[dev,accel]",
]

[project.urls]
Homepage = "https://grilly.org"
Repository = "https://github.com/grillcheese-ai/grilly"
Documentation = "https://grilly.org/docs"

# Explicit package mapping since pyproject.toml is inside the package directory
[tool.setuptools]
packages = [
    "grilly",
    "grilly.backend",
    "grilly.grilly_datasets",
    "grilly.examples",
    "grilly.experimental_datasets",
    "grilly.nn",
    "grilly.optim",
    "grilly.utils",
    "grilly.functional",
    "grilly.scripts",
    "grilly.tutorials",
    "grilly.tests",
    "grilly.experimental"
]

[tool.setuptools.package-dir]
"grilly" = "."
"grilly.backend" = "backend"
"grilly.nn" = "nn"
"grilly.optim" = "optim"
"grilly.utils" = "utils"
"grilly.functional" = "functional"
"grilly.scripts" = "scripts"
"grilly.tutorials" = "tutorials"
"grilly.tests" = "tests"
"grilly.experimental" = "experimental"
"grilly.experimental_datasets" = "experimental_datasets"
"grilly.grilly_datasets" = "grilly_datasets"
"grilly.examples" = "examples"

[tool.setuptools.package-data]
grilly = [
    "shaders/**/*.glsl",
    "shaders/**/*.comp",
    "shaders/**/*.spv",
    "*.pyd",
    "*.so",
]

[tool.setuptools_scm]
write_to = "_version.py"
fallback_version = "0.4.0"

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
    | __pycache__
    | \.venv
    | build
    | dist
    | shaders/spv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",
    "E402",  # import not at top (conditional imports)
    "E722",  # bare except (used for broad fallbacks)
    "E741",  # ambiguous variable name (l, O)
    "F403",  # star import (vulkan)
    "F405",  # star import undefined (vulkan)
    "F811",  # redefined while unused
    "N801",  # class name (no_grad, enable_grad context managers)
    "N802",  # function name (VK_MAKE_VERSION etc.)
    "N803",  # argument name (W_gate, W_up ML convention)
    "N806",  # variable name (X, y, N ML convention)
    "N811",  # constant imported as non-constant
    "N812",  # lowercase imported as non-lowercase
    "N817",  # camelcase imported as acronym
    "N999",  # module name (09_data_loading.py tutorials)
]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files
"__init__.py" = ["F401"]
# Tests: unused imports common in test setup
"tests/**/*.py" = ["F401"]
"test_quick.py" = ["F401"]
# Optional deps: numba imports for availability check
"utils/numba_ops.py" = ["F401"]
# Scripts, tutorials: optional imports
"scripts/*.py" = ["F401"]
"tutorials/*.py" = ["F401"]
# Optional config/tensor imports
"backend/snn_compute.py" = ["F401"]
"nn/module.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "benchmarks/*",
    "tutorials/*",
    "datasets/*",
    "scripts/*",
    "examples/*",
    "experimental_datasets/*",
    "mcp-servers/*",
    "docs/*",
    ".venv/*",
    # Optional/integration modules (heavy deps, require GPU or external services)
    "utils/vulkan_sentence_transformer.py",
    "utils/hippocampal_checkpoint.py",
    "utils/visualization.py",
    "backend/vma_wrapper.py",
    "backend/snn_visualizer.py",
    "backend/hilbert.py",
    "backend/_glu_append.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]
# Target: 80%. Full run (GPU) ~45%, CPU-only ~32%. GPU coverage is priority.
fail_under = 40

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# importmode = "importlib"  # requires pytest >= 9.x
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "grilly",
]
