[project]
name = "elephant-coder"
version = "0.1.0"
description = "MCP server for persistent codebase memory — inspired by hippocampal memory circuits"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "redis>=5.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "memory_store", "indexer", "retriever", "consolidator"]
