# Grilly Workflow Add New Autograd Op

## Action

Follow the add-new-autograd-op workflow:
1. Implement or add new GLSL shader(s) for the operation if needed (e.g., shaders/rms-norm-backward.glsl, shaders/spv/rms-norm-backward.spv)
2. Update C++ autograd headers and source to add the handler (cpp/include/grilly/autograd/autograd.h, cpp/src/autograd.cpp)
3. Wire the operation into Python bindings (cpp/python/bindings_autograd.cpp)
4. Add or update a test for the new op (e.g., test_backward_rmsnorm.py, test_backward_swiglu.py, etc.)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~5x per month
- Files: cpp/include/grilly/autograd/autograd.h, cpp/src/autograd.cpp, cpp/python/bindings_autograd.cpp

